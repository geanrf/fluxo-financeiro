spring:
  datasource:
    url: jdbc:h2:file:${H2_DATABASE_PATH:../.local/h2/finance};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    create-schemas: true
    default-schema: finance
    schemas: finance
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: finance

logging:
  level:
    com.portfolio.finance: INFO
    org.hibernate.SQL: WARN

app:
  security:
    jwt:
      access-token-ttl: PT2H

